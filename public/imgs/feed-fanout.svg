<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 200" role="img" aria-labelledby="title">
  <title>A post goes through Kafka to a worker, which writes it into each follower's feed</title>
  <rect width="304" height="200" fill="#0b1120"/>
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M70 100 H84" stroke="#334155"/>
    <path d="M130 100 H144" stroke="#334155"/>
    <path d="M198 100 C210 100 206 34 218 34" stroke="#2dd4bf"/>
    <path d="M198 100 C210 100 206 78 218 78" stroke="#2dd4bf"/>
    <path d="M198 100 C210 100 206 122 218 122" stroke="#2dd4bf"/>
    <path d="M198 100 C210 100 206 166 218 166" stroke="#475569" stroke-dasharray="3 4"/>
  </g>
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
    <rect x="8" y="76" width="62" height="48" rx="4" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="96" font-size="12" font-weight="700" fill="#94a3b8">POST</text>
    <text x="16" y="114" font-size="12" fill="#e2e8f0">@nahom</text>

    <rect x="84" y="87" width="46" height="26" rx="13" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
    <text x="107" y="104.5" font-size="11" fill="#94a3b8" text-anchor="middle">kafka</text>

    <rect x="144" y="84" width="54" height="32" rx="4" fill="#111a2e" stroke="#5eead4" stroke-width="1.5"/>
    <text x="171" y="104.5" font-size="12" font-weight="700" fill="#5eead4" text-anchor="middle">worker</text>

    <g font-size="12">
      <rect x="218" y="21" width="78" height="26" rx="4" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
      <text x="226" y="38.5"><tspan fill="#64748b">feed</tspan><tspan fill="#e2e8f0" dx="6">bob</tspan></text>
      <rect x="218" y="65" width="78" height="26" rx="4" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
      <text x="226" y="82.5"><tspan fill="#64748b">feed</tspan><tspan fill="#e2e8f0" dx="6">sara</tspan></text>
      <rect x="218" y="109" width="78" height="26" rx="4" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
      <text x="226" y="126.5"><tspan fill="#64748b">feed</tspan><tspan fill="#e2e8f0" dx="6">abel</tspan></text>
      <text x="222" y="170.5" fill="#94a3b8">+ 19,997</text>
    </g>
  </g>
</svg>
