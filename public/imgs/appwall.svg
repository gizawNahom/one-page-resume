<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 200" role="img" aria-labelledby="title">
  <title>Blocked apps are routed into a tunnel that never forwards their traffic, while other apps reach the internet</title>
  <rect width="304" height="200" fill="#0b1120"/>
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M112 34 C160 34 170 56 218 56" stroke="#334155"/>
    <path d="M112 78 C160 78 170 56 218 56" stroke="#334155"/>
    <path d="M112 122 C136 122 136 144 158 144" stroke="#2dd4bf"/>
    <path d="M112 166 C136 166 136 144 158 144" stroke="#2dd4bf"/>
    <path d="M214 144 H222" stroke="#475569" stroke-dasharray="3 4"/>
    <path d="M228 138 L240 150 M240 138 L228 150" stroke="#94a3b8"/>
  </g>
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">
    <rect x="8" y="21" width="104" height="26" rx="4" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="38.5" fill="#e2e8f0">browser</text>
    <rect x="8" y="65" width="104" height="26" rx="4" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="82.5" fill="#e2e8f0">maps</text>
    <rect x="8" y="109" width="104" height="26" rx="4" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="126.5"><tspan fill="#e2e8f0">game</tspan><tspan fill="#5eead4" dx="8">blocked</tspan></text>
    <rect x="8" y="153" width="104" height="26" rx="4" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="170.5"><tspan fill="#e2e8f0">shop</tspan><tspan fill="#5eead4" dx="8">blocked</tspan></text>

    <rect x="218" y="43" width="78" height="26" rx="13" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
    <text x="257" y="60.5" font-size="11" fill="#94a3b8" text-anchor="middle">internet</text>

    <rect x="158" y="128" width="56" height="32" rx="4" fill="#111a2e" stroke="#5eead4" stroke-width="1.5"/>
    <text x="186" y="148.5" font-weight="700" fill="#5eead4" text-anchor="middle">tunnel</text>
    <text x="246" y="148" font-size="11" fill="#94a3b8">dropped</text>
  </g>
</svg>
