<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 200" role="img" aria-labelledby="title">
  <title>LedgerOps transfer request: POST /transfers with an Idempotency-Key header</title>
  <rect width="304" height="200" fill="#0b1120"/>
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="19">
    <text x="22" y="40"><tspan fill="#5eead4" font-weight="700">POST</tspan><tspan fill="#e2e8f0" dx="11">/transfers</tspan></text>
    <text x="22" y="67"><tspan fill="#94a3b8">Idempotency-Key:</tspan><tspan fill="#e2e8f0" dx="11">k-1</tspan></text>
    <text x="22" y="104" fill="#64748b">{</text>
    <text y="130"><tspan x="45" fill="#94a3b8">"from":</tspan><tspan x="160" fill="#e2e8f0">"alice"</tspan></text>
    <text y="156"><tspan x="45" fill="#94a3b8">"to":</tspan><tspan x="160" fill="#e2e8f0">"bob"</tspan></text>
    <text y="182"><tspan x="45" fill="#94a3b8">"amount":</tspan><tspan x="160" fill="#e2e8f0">"50.00"</tspan></text>
    <text x="252" y="182" fill="#64748b">}</text>
  </g>
</svg>
